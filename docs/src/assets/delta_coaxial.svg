<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="880" height="620" viewBox="0 0 880 620"
     font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Coaxial and standing column well: cross-sections and steady-state networks</title>
  <defs>
    <path id="res" d="M-18,0 H-12 L-10,-5 L-6,5 L-2,-5 L2,5 L6,-5 L10,5 L12,0 H18"
          fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
    <circle id="node" r="4" fill="#000"/>
    <circle id="fnode" r="5" fill="#1f77b4" stroke="#000" stroke-width="1"/>
  </defs>

  <rect id="background" x="0" y="0" width="880" height="620" fill="#fff"/>

  <!-- ============================== Coaxial ============================== -->
  <g id="coaxial" inkscape:groupmode="layer" inkscape:label="Coaxial">
    <text x="20" y="30" font-weight="bold">Coaxial</text>
    <text x="90" y="30" font-size="13" fill="#444">(inlet = :annulus: down the annulus, up the center pipe; or inlet = :center)</text>
    <g id="coaxial-section">
      <rect x="25" y="55" width="230" height="230" rx="6" fill="#f3e9dc" stroke="#8c564b"
            stroke-width="1"/>
      <circle cx="140" cy="170" r="100" fill="#e5e5e5" stroke="#000" stroke-width="2"/>
      <circle cx="140" cy="170" r="82.5" fill="#cfe3f5" stroke="#555" stroke-width="7"/>
      <circle cx="140" cy="170" r="34.5" fill="#cfe3f5" stroke="#555" stroke-width="7"/>
      <text x="134" y="176" text-anchor="middle" font-weight="bold" fill="#1f77b4">1</text>
      <text x="140" y="235" text-anchor="middle" font-weight="bold" fill="#1f77b4">2</text>
      <g id="coaxial-leaders" stroke="#000" stroke-width="0.8" fill="none">
        <line x1="151.5" y1="160.4" x2="270" y2="196"/>
        <line x1="166.4" y1="147.8" x2="270" y2="171"/>
        <line x1="184.4" y1="132.7" x2="270" y2="146"/>
        <line x1="203.2" y1="117" x2="270" y2="121"/>
        <line x1="211.2" y1="110.2" x2="270" y2="96"/>
        <line x1="222.7" y1="100.6" x2="270" y2="71"/>
      </g>
      <g font-size="13">
        <text x="274" y="200" fill="#1f77b4">center fluid (1)</text>
        <text x="274" y="175">inner pipe</text>
        <text x="274" y="150" fill="#1f77b4">annulus fluid (2)</text>
        <text x="274" y="125">outer pipe</text>
        <text x="274" y="100">grout (if r<tspan baseline-shift="sub" font-size="70%">oo</tspan> &lt; r<tspan baseline-shift="sub" font-size="70%">b</tspan>)</text>
        <text x="274" y="75" fill="#8c564b">ground</text>
      </g>
    </g>
    <g id="coaxial-network">
      <g fill="none" stroke="#000" stroke-width="1.6">
        <line x1="400" y1="140" x2="438" y2="140"/>
        <line x1="474" y1="140" x2="494" y2="140"/>
        <line x1="530" y1="140" x2="550" y2="140"/>
        <line x1="586" y1="140" x2="662" y2="140"/>
        <line x1="698" y1="140" x2="718" y2="140"/>
        <line x1="754" y1="140" x2="774" y2="140"/>
        <line x1="810" y1="140" x2="848" y2="140"/>
      </g>
      <use xlink:href="#res" x="456" y="140"/>
      <use xlink:href="#res" x="512" y="140"/>
      <use xlink:href="#res" x="568" y="140"/>
      <use xlink:href="#res" x="680" y="140"/>
      <use xlink:href="#res" x="736" y="140"/>
      <use xlink:href="#res" x="792" y="140"/>
      <use xlink:href="#fnode" x="400" y="140"/>
      <use xlink:href="#fnode" x="624" y="140"/>
      <use xlink:href="#node" x="848" y="140"/>
      <g font-size="13" text-anchor="middle">
        <text x="456" y="166">R<tspan baseline-shift="sub" font-size="70%">f,in</tspan></text>
        <text x="512" y="166">R<tspan baseline-shift="sub" font-size="70%">pi</tspan></text>
        <text x="568" y="166">R<tspan baseline-shift="sub" font-size="70%">f,ann,in</tspan></text>
        <text x="680" y="166">R<tspan baseline-shift="sub" font-size="70%">f,ann,out</tspan></text>
        <text x="736" y="166">R<tspan baseline-shift="sub" font-size="70%">po</tspan></text>
        <text x="792" y="166">R<tspan baseline-shift="sub" font-size="70%">g</tspan></text>
      </g>
      <g font-size="15" text-anchor="middle">
        <text x="400" y="168" fill="#1f77b4">T<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
        <text x="624" y="168" fill="#1f77b4">T<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
        <text x="848" y="168">T<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
      </g>
      <g id="coaxial-brackets" fill="none" stroke="#000" stroke-width="1">
        <path d="M402,118 V108 H622 V118"/>
        <path d="M626,118 V108 H846 V118"/>
      </g>
      <g text-anchor="middle">
        <text x="512" y="100">R<tspan baseline-shift="sub" font-size="70%">12</tspan></text>
        <text x="736" y="100">R<tspan baseline-shift="sub" font-size="70%">1</tspan> = R<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
      </g>
    </g>
    <g id="coaxial-definitions" font-size="13">
      <text x="400" y="206">R<tspan baseline-shift="sub" font-size="70%">12</tspan>: center fluid to annulus fluid (film, inner pipe, film)</text>
      <text x="400" y="228">R<tspan baseline-shift="sub" font-size="70%">1</tspan> = R<tspan baseline-shift="sub" font-size="70%">b</tspan>: annulus fluid to borehole wall (film, outer pipe, grout)</text>
      <text x="400" y="250" fill="#444">R<tspan baseline-shift="sub" font-size="70%">g</tspan> = 0 when r<tspan baseline-shift="sub" font-size="70%">oo</tspan> = r<tspan baseline-shift="sub" font-size="70%">b</tspan> (outer pipe against the ground)</text>
      <text x="400" y="272" fill="#444">Lamarche (2021); Bauer et al. (2011)</text>
    </g>
  </g>

  <line id="separator" x1="20" y1="305" x2="860" y2="305" stroke="#ccc" stroke-width="1"/>

  <!-- ========================= Standing column well ========================= -->
  <g id="standing-column" inkscape:groupmode="layer" inkscape:label="Standing column well">
    <text x="20" y="340" font-weight="bold">Standing column well</text>
    <text x="190" y="340" font-size="13" fill="#444">(StandingColumn, no bleed; inlet = :annulus: down the annulus, up the dip tube)</text>
    <g id="scw-section">
      <rect x="25" y="365" width="230" height="230" rx="6" fill="#f3e9dc" stroke="#8c564b"
            stroke-width="1"/>
      <circle cx="140" cy="480" r="100" fill="#cfe3f5" stroke="#8c564b" stroke-width="3"/>
      <circle cx="140" cy="480" r="34.5" fill="#cfe3f5" stroke="#555" stroke-width="7"/>
      <text x="134" y="486" text-anchor="middle" font-weight="bold" fill="#1f77b4">1</text>
      <text x="140" y="552" text-anchor="middle" font-weight="bold" fill="#1f77b4">2</text>
      <g id="scw-leaders" stroke="#000" stroke-width="0.8" fill="none">
        <line x1="151.5" y1="470.4" x2="270" y2="506"/>
        <line x1="166.4" y1="457.8" x2="270" y2="481"/>
        <line x1="190.6" y1="437.6" x2="270" y2="456"/>
        <line x1="216.6" y1="415.7" x2="270" y2="431"/>
        <line x1="226.6" y1="407.4" x2="270" y2="406"/>
      </g>
      <g font-size="13">
        <text x="274" y="510" fill="#1f77b4">dip tube water (1)</text>
        <text x="274" y="485">dip tube</text>
        <text x="274" y="460" fill="#1f77b4">annulus water (2)</text>
        <text x="274" y="435">open borehole wall</text>
        <text x="274" y="410" fill="#8c564b">rock</text>
      </g>
    </g>
    <g id="scw-network">
      <g fill="none" stroke="#000" stroke-width="1.6">
        <line x1="400" y1="450" x2="438" y2="450"/>
        <line x1="474" y1="450" x2="494" y2="450"/>
        <line x1="530" y1="450" x2="550" y2="450"/>
        <line x1="586" y1="450" x2="662" y2="450"/>
        <line x1="698" y1="450" x2="736" y2="450"/>
      </g>
      <use xlink:href="#res" x="456" y="450"/>
      <use xlink:href="#res" x="512" y="450"/>
      <use xlink:href="#res" x="568" y="450"/>
      <use xlink:href="#res" x="680" y="450"/>
      <use xlink:href="#fnode" x="400" y="450"/>
      <use xlink:href="#fnode" x="624" y="450"/>
      <use xlink:href="#node" x="736" y="450"/>
      <g font-size="13" text-anchor="middle">
        <text x="456" y="476">R<tspan baseline-shift="sub" font-size="70%">f,in</tspan></text>
        <text x="512" y="476">R<tspan baseline-shift="sub" font-size="70%">p</tspan></text>
        <text x="568" y="476">R<tspan baseline-shift="sub" font-size="70%">f,ann,in</tspan></text>
        <text x="680" y="476">R<tspan baseline-shift="sub" font-size="70%">f,wall</tspan></text>
      </g>
      <g font-size="15" text-anchor="middle">
        <text x="400" y="478" fill="#1f77b4">T<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
        <text x="624" y="478" fill="#1f77b4">T<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
        <text x="736" y="478">T<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
      </g>
      <g id="scw-brackets" fill="none" stroke="#000" stroke-width="1">
        <path d="M402,428 V418 H622 V428"/>
        <path d="M626,428 V418 H734 V428"/>
      </g>
      <g text-anchor="middle">
        <text x="512" y="410">R<tspan baseline-shift="sub" font-size="70%">12</tspan></text>
        <text x="680" y="410">R<tspan baseline-shift="sub" font-size="70%">1</tspan> = R<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
      </g>
    </g>
    <g id="scw-definitions" font-size="13">
      <text x="400" y="516">R<tspan baseline-shift="sub" font-size="70%">12</tspan>: dip tube water to annulus water (film, dip tube, film)</text>
      <text x="400" y="538">R<tspan baseline-shift="sub" font-size="70%">1</tspan> = R<tspan baseline-shift="sub" font-size="70%">b</tspan>: annulus water to the rock, a convective film only</text>
      <text x="400" y="560" fill="#444">no grout; wall film from the annulus flow and the wall roughness ϵ<tspan baseline-shift="sub" font-size="70%">b</tspan></text>
      <text x="400" y="582" fill="#444">Nguyen et al. (2015)</text>
    </g>
  </g>
</svg>
